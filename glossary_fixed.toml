# 固定訳 (どの論文でも優先される訳語)。論文ごとに Gemini が作る用語集より優先され、論文の本文に出てきた語だけが翻訳に渡される。
# 追加・変更は自由 (大文字小文字は区別しない)。論文ごとの glossary_override.json があるときは、そちらが優先され、この表は使われない。
#
# [terms]    英語 = 日本語
# [variants] 日本語 (上の訳語) = ["訳文に出てしまいがちな別表記", ...]  (翻訳後に、ここに書いた別表記を上の訳語へ統一する。省略可)

